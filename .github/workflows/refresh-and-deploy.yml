name: Refresh data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_odds:
        description: 'Force a Hard Rock + FanDuel + DraftKings pull now, ignoring the 30-min / 2-h interval gate (budget guard still applies)'
        type: boolean
        default: false
  schedule:
    # Every 30 minutes (UTC): ESPN data (DK opening lines/fallback), plus Hard Rock Bet + FanDuel + DraftKings from The Odds API
    # (paid 100K plan) when the budget guard allows. cron-job.org also dispatches at :15/:45 ET; a persisted
    # per-league interval gate (scripts/odds_budget.py) makes sure the extra runs don't double-spend.
    # GitHub may delay or skip scheduled runs under load. Budget math: docs/odds_api_budget.md
    - cron: '*/30 * * * *'

# Least privilege for the GITHUB_TOKEN by default; each job widens only what it needs.
permissions:
  contents: read

# One run at a time. Don't cancel an in-flight run; a queued run replaces older queued ones.
# This also serializes writes to the data-history branch (the push step still retries on a race).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # push line-movement snapshots to the data-history branch
      pages: write      # configure-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # IndexNow baseline: the live sitemap as deployed by the previous run, fetched before this run builds or deploys.
      # The indexnow job (scripts/indexnow_ping.py) pings only URLs that are new or re-dated against it. A failed fetch
      # just means no ping this run.
      - name: Fetch live sitemap (IndexNow baseline)
        continue-on-error: true
        run: |
          mkdir -p _indexnow/prev
          if curl -fsS --max-time 20 --retry 2 -H 'Cache-Control: no-cache' -o _indexnow/prev/sitemap.xml "https://linesmart.app/sitemap.xml?indexnow=${{ github.run_id }}"; then
            python3 - <<'PY'
          import pathlib, re, subprocess, sys
          p = pathlib.Path("_indexnow/prev/sitemap.xml")
          xml = p.read_text(encoding="utf-8", errors="replace")
          if "<sitemapindex" not in xml:
              print(f"IndexNow baseline: urlset, {xml.count('<loc>')} URLs")
              sys.exit(0)
          n = 0
          for loc in re.findall(r"<loc>\s*(.*?)\s*</loc>", xml):
              name = loc.split("?", 1)[0].rstrip("/").rsplit("/", 1)[-1]
              if not name.endswith(".xml"):
                  continue
              url = loc.split("?", 1)[0]
              subprocess.check_call(["curl", "-fsS", "--max-time", "20", "--retry", "2", "-H", "Cache-Control: no-cache", "-o", str(p.parent / name), url])
              n += 1
          print(f"IndexNow baseline: sitemap index with {n} child file(s)")
          PY
          else
            rm -rf _indexnow/prev
            echo "::warning title=IndexNow::could not fetch the live sitemap; this run will not ping IndexNow"
          fi

      # Line-movement history lives on its own branch (never main), checked out as a worktree in _history/.
      - name: Check out line history (data-history branch)
        id: hist
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-history >/dev/null; then
            git fetch --no-tags --depth=1 origin +data-history:refs/remotes/origin/data-history
            git worktree add -B data-history _history origin/data-history
          else
            echo "data-history branch not found; starting a new orphan branch"
            git worktree add --detach _history
            git -C _history checkout -q --orphan data-history
            git -C _history rm -rfq --ignore-unmatch .
          fi
          mkdir -p _history/history _history/odds _history/rosters _history/matchups _history/weather _history/advstats
          ls -la _history/history _history/odds _history/rosters _history/matchups _history/weather _history/advstats

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # build_data.py uses only the Python standard library (urllib, zoneinfo, json...).
      # tzdata is installed as a safety net for zoneinfo in case the OS tz database is missing.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet tzdata

      # The Odds API key is exposed on scheduled and dispatched runs (cron-job.org / manual), and only when the
      # data-history checkout worked: the interval gate, quota and usage live there, so without it we'd spend blind.
      # Pushes never see the key; they reuse the last pull saved on data-history. Set the repo variable
      # ODDS_PAUSE=1 to stop all Odds API calls without a code change.
      - name: Decide whether this run may use The Odds API
        id: mode
        env:
          PULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.hist.outcome == 'success' && vars.ODDS_PAUSE != '1' }}
        run: |
          echo "pull=$PULL" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} pull_odds(force)='${{ inputs.pull_odds }}' paused='${{ vars.ODDS_PAUSE }}' -> Odds API allowed: $PULL"

      - name: Build fresh data (ESPN + Hard Rock/FanDuel/DraftKings via The Odds API, budget-guarded)
        id: build
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ steps.mode.outputs.pull == 'true' && secrets.ODDS_API_KEY || '' }}
          # Budget guard (scripts/odds_budget.py, docs/odds_api_budget.md): ~80K of the 100K monthly credits,
          # never below 300 remaining; props are throttled first, then the game-line interval.
          ODDS_MIN_CREDITS: '300'
          ODDS_BUDGET: '80000'
          ODDS_PLAN_CREDITS: '100000'
          ODDS_BILLING_DAY: '26'        # credits reset on the subscription day (subscribed 2026-10-26)
          ODDS_RUN_MAX_CREDITS: '250'   # hard cap per run
          ODDS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_odds && '1' || '' }}
          ODDS_PAUSE: ${{ vars.ODDS_PAUSE }}
          # History / persisted odds are only read/written when the history checkout succeeded.
          LINE_HISTORY_DIR: ${{ steps.hist.outcome == 'success' && '_history/history' || '' }}
          ODDS_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/odds' || '' }}
          # Team rosters for the search index: cached on data-history, re-fetched when older than ~20h.
          ROSTER_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/rosters' || '' }}
          # Compact per-game box scores for opponent defense vs position (data/matchups); only new games are fetched.
          MATCHUP_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/matchups' || '' }}
          # Game-day weather (Open-Meteo, no key): venue coordinates + recent forecasts, so most runs reuse them.
          WEATHER_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/weather' || '' }}
          # advanced stats: nflverse aggregate (refreshed ~daily) + ATS/O-U closing-line store
          ADV_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/advstats' || '' }}
          LINE_SNAP_DIR: .linehist-snap
          # Keep-last-good fallback: when ESPN fails for a league (HTTP error, or an empty feed while the deployed copy
          # still had upcoming games), carry over that league's games from the currently deployed site, marked stale.
          # Gives up after LASTGOOD_MAX_H hours or once those games are over. LASTGOOD_SRC="" turns it off.
          LASTGOOD_SRC: https://linesmart.app/data/
          LASTGOOD_MAX_H: '18'
        run: python scripts/build_data.py

      # If the build crashed outright, fall back to the committed snapshot so the site still deploys.
      - name: Restore committed data snapshot if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::Data build failed; deploying the committed snapshot in site/data instead."
          git checkout -- site/data
          git clean -fdq site/data

      - name: Sanity-check data
        run: |
          python - <<'PY'
          import json, glob
          meta = json.load(open("site/data/meta.json"))
          print("generated:", meta.get("generated"), "| hardrock:", json.dumps({k: v for k, v in (meta.get("hardrock") or {}).items() if k != "leagues"}))
          print("odds api:", json.dumps(meta.get("oddsApi")))
          for k, v in meta.get("leagues", {}).items():
              st = v.get("stale")
              print(f"  {k:6} games={v.get('games')} upcoming={v.get('upcoming')} withOdds={v.get('withOdds')} error={v.get('error')}"
                    + (f" STALE(last good as of {st.get('asOf')}: {st.get('reason')})" if st else ""))
          fb = (meta.get("fallback") or {}).get("leagues") or {}
          if fb:
              print("FALLBACK (last good data) used for:", ", ".join(sorted(fb)))
              for k, v in sorted(fb.items()):
                  print(f"::warning title=LineSmart fallback ({k})::{v.get('reason')} - showing last good data as of {v.get('asOf')}")
          else:
              print("fallback: none needed this run")
          for f in glob.glob("site/data/*/index.json"):
              json.load(open(f))
          PY

      # Crawlable SEO pages (scripts/seo_pages.py): league hubs, game, player-props, team, UFC event and fighter pages,
      # and /<lg>/results/ archives, under site/<league>/**. Redirect stubs for retired URLs (incl. the old /preview/
      # pages), data/pages.json for the app's real-URL links, sitemap.xml (a sitemap index) and the homepage cards in
      # index.html. Reads site/data only (no network, no API key). Finished games stay up permanently (final score +
      # closing lines) in an archive on the data-history branch (_history/pages); without the worktree it builds from
      # site/data alone.
      - name: Build SEO pages
        id: seo
        continue-on-error: true
        env:
          ARCHIVE_DIR: ${{ steps.hist.outcome == 'success' && '_history/pages' || '' }}
        run: |
          python scripts/seo_pages.py
          if [ -d _history/pages ]; then rm -rf .linehist-snap/_pages && mkdir -p .linehist-snap && cp -r _history/pages .linehist-snap/_pages; fi

      # The sitemap this run deploys, for the indexnow job. Only when the SEO build ran with the archive, so each
      # page's lastmod is the stored content-change date (not "now") and the diff stays small.
      - name: Keep deployed sitemap for IndexNow
        if: steps.seo.outcome == 'success' && steps.hist.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p _indexnow/new
          cp site/sitemap.xml _indexnow/new/sitemap.xml
          shopt -s nullglob
          cp site/sitemap-*.xml _indexnow/new/

      - name: Upload IndexNow sitemaps
        if: steps.seo.outcome == 'success' && steps.hist.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: indexnow
          path: _indexnow/
          retention-days: 1
          if-no-files-found: ignore

      # Only persist history from a successful build. On a push race, re-apply this run's
      # snapshot on top of the latest branch tip and try again; never force-push.
      - name: Save line history snapshot
        if: steps.build.outcome == 'success' && steps.hist.outcome == 'success'
        continue-on-error: true
        working-directory: _history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          msg="line history snapshot $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})"
          git add -A history odds rosters matchups weather advstats $( [ -d pages ] && echo pages )
          if git diff --cached --quiet; then echo "No history changes."; exit 0; fi
          git commit -qm "$msg"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:refs/heads/data-history; then
              echo "Pushed: $(git log -1 --format='%h %s')"; ls -la history odds rosters matchups weather; exit 0
            fi
            echo "::warning::data-history push rejected (attempt $i); re-applying snapshot onto latest tip"
            sleep $((i * 5))
            git fetch --no-tags --depth=1 origin +data-history:refs/remotes/origin/data-history || continue
            git reset -q --hard origin/data-history
            python3 ../scripts/line_history.py apply --snap-dir ../.linehist-snap --history-dir history
            if [ -d ../.linehist-snap/_odds ]; then python3 ../scripts/line_history.py apply-odds --src ../.linehist-snap/_odds --dst odds; fi
            if [ -d ../.linehist-snap/_rosters ]; then cp -f ../.linehist-snap/_rosters/*.json rosters/; fi
            if [ -d ../.linehist-snap/_matchups ]; then mkdir -p matchups && cp -f ../.linehist-snap/_matchups/*.json matchups/; fi
            if [ -d ../.linehist-snap/_weather ]; then mkdir -p weather && cp -f ../.linehist-snap/_weather/*.json weather/; fi
            if [ -d ../.linehist-snap/_adv ]; then mkdir -p advstats && cp -f ../.linehist-snap/_adv/*.json advstats/; fi
            if [ -d ../.linehist-snap/_pages ]; then mkdir -p pages && cp -f ../.linehist-snap/_pages/*.json pages/; fi
            git add -A history odds rosters matchups weather advstats $( [ -d pages ] && echo pages )
            if git diff --cached --quiet; then echo "Nothing left to push."; exit 0; fi
            git commit -qm "$msg"
          done
          echo "::error::Could not push line history after 5 attempts"; exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stamp service-worker cache version
        # New VERSION on every deploy -> browsers install the new worker and drop the old shell cache.
        # Format: <shell content hash>-<UTC build time>. Data JSON is network-first, so the 30-min refresh is unaffected.
        run: |
          H=$(cat site/*.html site/manifest.webmanifest site/assets/*.css site/assets/*.js | sha256sum | cut -c1-10)
          V="$H-$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"$V\";/" site/sw.js
          sed -i "s/^  const SITE_BUILD = \".*\";/  const SITE_BUILD = \"$V\";/" site/assets/pro-gate-core.js
          grep -q "const VERSION = \"$V\";" site/sw.js && grep -q "const SITE_BUILD = \"$V\";" site/assets/pro-gate-core.js && echo "sw.js VERSION=$V"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages deploy needs pages + id-token (OIDC).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # IndexNow (Bing, Yandex, Seznam...): after a successful deploy of main, POST the new / changed SEO page URLs
  # (sitemap diff against the pre-deploy live sitemap) once, in one batch. The key file is site/<key>.txt.
  # Never fails the run: the script always exits 0 and the job is continue-on-error. See docs/seo-pages.md.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout (ping script + key file only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/indexnow_ping.py
            /site/*.txt
          sparse-checkout-cone-mode: false

      - name: Download IndexNow sitemaps
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: indexnow
          path: _indexnow

      - name: Ping IndexNow
        run: python3 scripts/indexnow_ping.py --prev _indexnow/prev/sitemap.xml --new _indexnow/new/sitemap.xml
