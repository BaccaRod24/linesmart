<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050b1c">
<title>Page not found · LineSmart</title>
<script>
/* GitHub Pages serves this for any missing path. Game preview pages (/preview/<league>/<game>/) are rebuilt every
 * data refresh and drop out once the game is a few days old: send those to the league's page in the app.
 * Works at the domain root or under a project subpath (everything before /preview/ is the site root). */
(function () {
  var p = location.pathname, i = p.indexOf("/preview/");
  if (i < 0) return;
  var root = p.slice(0, i + 1), m = p.slice(i + 9).match(/^([a-z0-9]+)\//);
  location.replace(root + (m ? "#/l/" + m[1] : "preview/"));
})();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050b1c;color:#e8eeff;font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;padding:32px 24px;text-align:center}
h1{font-size:26px;margin:0 0 8px}
a{color:#3d9bff;font-weight:650}
.rg{color:#7f90ba;font-size:12.5px;margin-top:28px}
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>This page doesn't exist or has moved. If it was a game preview, the game has probably finished.</p>
<p><a id="home" href="/">Go to LineSmart odds &amp; lines</a></p>
<p class="rg">21+ only. Gambling problem? Call or text <a href="tel:18004262537">1-800-GAMBLER</a>.</p>
</main>
<script>
/* subpath-safe home link: first path segment is the project path on github.io, none on the custom domain */
(function () { if (/\.github\.io$/.test(location.hostname)) { var s = location.pathname.split("/")[1]; if (s) document.getElementById("home").href = "/" + s + "/"; } })();
</script>
</body>
</html>
