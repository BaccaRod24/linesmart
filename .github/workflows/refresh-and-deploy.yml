name: Refresh data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_odds:
        description: 'Force a Hard Rock + FanDuel + DraftKings pull now, ignoring the 30-min / 2-h interval gate (budget guard still applies)'
        type: boolean
        default: false
      publish_run_id:
        description: 'Internal. Deploy the already-built site bundle from this Actions run id. Leave empty.'
        type: string
        default: ''
  schedule:
    # Every 30 minutes (UTC): ESPN data (DK opening lines/fallback), plus Hard Rock Bet + FanDuel + DraftKings from The Odds API
    # (paid 100K plan) when the budget guard allows. cron-job.org also dispatches at :15/:45 ET; a persisted
    # per-league interval gate (scripts/odds_budget.py) makes sure the extra runs don't double-spend.
    # GitHub may delay or skip scheduled runs under load. Budget math: docs/odds_api_budget.md
    - cron: '*/30 * * * *'

# Least privilege for the GITHUB_TOKEN by default; each job widens only what it needs.
permissions:
  contents: read

# `pages` serializes data builds (and their data-history pushes). A queued run replaces older queued ones.
# Don't cancel an in-flight build. `pages-live` is a different group, used only by the run that deploys a
# commit SHA Pages has not deployed before, so a build can wait for that publish without deadlocking.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_run_id || '') != '' && 'pages-live' || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    # A publish run only deploys a bundle another run already built. A stamp commit must not build again:
    # GITHUB_TOKEN pushes do not start workflows, but a push that does get through would spend another
    # ESPN pass and could deploy over the bundle. (inputs.publish_run_id || '') treats schedule events,
    # where the input is null, as a normal build.
    if: ${{ (inputs.publish_run_id || '') == '' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message || '', 'Publish pages data ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      data_ok: ${{ steps.build.outcome }}
    permissions:
      contents: write   # push line-movement snapshots to the data-history branch
      pages: write      # configure-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # IndexNow baseline: the live sitemap as deployed by the previous run, fetched before this run builds or deploys.
      # The indexnow job (scripts/indexnow_ping.py) pings only URLs that are new or re-dated against it. A failed fetch
      # just means no ping this run.
      - name: Fetch live sitemap (IndexNow baseline)
        continue-on-error: true
        run: |
          mkdir -p _indexnow/prev
          if curl -fsS --max-time 20 --retry 2 -H 'Cache-Control: no-cache' -o _indexnow/prev/sitemap.xml "https://linesmart.app/sitemap.xml?indexnow=${{ github.run_id }}"; then
            python3 - <<'PY'
          import pathlib, re, subprocess, sys
          p = pathlib.Path("_indexnow/prev/sitemap.xml")
          xml = p.read_text(encoding="utf-8", errors="replace")
          if "<sitemapindex" not in xml:
              print(f"IndexNow baseline: urlset, {xml.count('<loc>')} URLs")
              sys.exit(0)
          n = 0
          for loc in re.findall(r"<loc>\s*(.*?)\s*</loc>", xml):
              name = loc.split("?", 1)[0].rstrip("/").rsplit("/", 1)[-1]
              if not name.endswith(".xml"):
                  continue
              url = loc.split("?", 1)[0]
              subprocess.check_call(["curl", "-fsS", "--max-time", "20", "--retry", "2", "-H", "Cache-Control: no-cache", "-o", str(p.parent / name), url])
              n += 1
          print(f"IndexNow baseline: sitemap index with {n} child file(s)")
          PY
          else
            rm -rf _indexnow/prev
            echo "::warning title=IndexNow::could not fetch the live sitemap; this run will not ping IndexNow"
          fi

      # Line-movement history lives on its own branch (never main), checked out as a worktree in _history/.
      - name: Check out line history (data-history branch)
        id: hist
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin data-history >/dev/null; then
            git fetch --no-tags --depth=1 origin +data-history:refs/remotes/origin/data-history
            git worktree add -B data-history _history origin/data-history
          else
            echo "data-history branch not found; starting a new orphan branch"
            git worktree add --detach _history
            git -C _history checkout -q --orphan data-history
            git -C _history rm -rfq --ignore-unmatch .
          fi
          mkdir -p _history/history _history/odds _history/rosters _history/matchups _history/weather _history/advstats _history/health
          ls -la _history/history _history/odds _history/rosters _history/matchups _history/weather _history/advstats

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # build_data.py uses only the Python standard library (urllib, zoneinfo, json...).
      # tzdata is installed as a safety net for zoneinfo in case the OS tz database is missing.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet tzdata

      # The Odds API key is exposed on scheduled and dispatched runs (cron-job.org / manual), and only when the
      # data-history checkout worked: the interval gate, quota and usage live there, so without it we'd spend blind.
      # Pushes never see the key; they reuse the last pull saved on data-history. Set the repo variable
      # ODDS_PAUSE=1 to stop all Odds API calls without a code change.
      - name: Decide whether this run may use The Odds API
        id: mode
        env:
          PULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.hist.outcome == 'success' && vars.ODDS_PAUSE != '1' }}
        run: |
          echo "pull=$PULL" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} pull_odds(force)='${{ inputs.pull_odds }}' paused='${{ vars.ODDS_PAUSE }}' -> Odds API allowed: $PULL"

      - name: Build fresh data (ESPN + Hard Rock/FanDuel/DraftKings via The Odds API, budget-guarded)
        id: build
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ steps.mode.outputs.pull == 'true' && secrets.ODDS_API_KEY || '' }}
          # Budget guard (scripts/odds_budget.py, docs/odds_api_budget.md): ~80K of the 100K monthly credits,
          # never below 300 remaining; props are throttled first, then the game-line interval.
          ODDS_MIN_CREDITS: '300'
          ODDS_BUDGET: '80000'
          ODDS_PLAN_CREDITS: '100000'
          ODDS_BILLING_DAY: '26'        # credits reset on the subscription day (subscribed 2026-10-26)
          ODDS_RUN_MAX_CREDITS: '250'   # hard cap per run
          ODDS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_odds && '1' || '' }}
          ODDS_PAUSE: ${{ vars.ODDS_PAUSE }}
          # History / persisted odds are only read/written when the history checkout succeeded.
          LINE_HISTORY_DIR: ${{ steps.hist.outcome == 'success' && '_history/history' || '' }}
          ODDS_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/odds' || '' }}
          # Team rosters for the search index: cached on data-history, re-fetched when older than ~20h.
          ROSTER_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/rosters' || '' }}
          # Compact per-game box scores for opponent defense vs position (data/matchups); only new games are fetched.
          MATCHUP_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/matchups' || '' }}
          # Game-day weather (Open-Meteo, no key): venue coordinates + recent forecasts, so most runs reuse them.
          WEATHER_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/weather' || '' }}
          # advanced stats: nflverse aggregate (refreshed ~daily) + ATS/O-U closing-line store
          ADV_CACHE_DIR: ${{ steps.hist.outcome == 'success' && '_history/advstats' || '' }}
          LINE_SNAP_DIR: .linehist-snap
          # One JSON file per run on data-history (health/<run id>.json). No extra API calls.
          RELIABILITY_DIR: ${{ steps.hist.outcome == 'success' && '_history/health' || '' }}
          # Keep-last-good fallback: when ESPN fails for a league (HTTP error, or an empty feed while the deployed copy
          # still had upcoming games), carry over that league's games from the currently deployed site, marked stale.
          # Gives up after LASTGOOD_MAX_H hours or once those games are over. LASTGOOD_SRC="" turns it off.
          LASTGOOD_SRC: https://linesmart.app/data/
          LASTGOOD_MAX_H: '18'
        run: python scripts/build_data.py

      # A crashed build must not publish. The committed snapshot in site/data is older than the
      # live site; deploying it would wipe fresher odds. Last-good leagues are kept inside a build that
      # exits 0 (scripts/lastgood.py). A non-zero build leaves https://linesmart.app untouched.
      - name: Keep the live site when the data build fails
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::Data build failed. Not publishing, so https://linesmart.app keeps the data it already has."
          exit 1

      - name: Sanity-check data
        if: steps.build.outcome == 'success'
        run: |
          python - <<'PY'
          import json, glob
          meta = json.load(open("site/data/meta.json"))
          print("generated:", meta.get("generated"), "| hardrock:", json.dumps({k: v for k, v in (meta.get("hardrock") or {}).items() if k != "leagues"}))
          print("odds api:", json.dumps(meta.get("oddsApi")))
          for k, v in meta.get("leagues", {}).items():
              st = v.get("stale")
              print(f"  {k:6} games={v.get('games')} upcoming={v.get('upcoming')} withOdds={v.get('withOdds')} error={v.get('error')}"
                    + (f" STALE(last good as of {st.get('asOf')}: {st.get('reason')})" if st else ""))
          fb = (meta.get("fallback") or {}).get("leagues") or {}
          if fb:
              print("FALLBACK (last good data) used for:", ", ".join(sorted(fb)))
              for k, v in sorted(fb.items()):
                  print(f"::warning title=LineSmart fallback ({k})::{v.get('reason')} - showing last good data as of {v.get('asOf')}")
          else:
              print("fallback: none needed this run")
          fresh = meta.get("freshness") or {}
          print("freshness:", json.dumps({k: {"stale": v.get("stale"), "ageMin": v.get("ageMin"), "pulledAt": v.get("pulledAt"), "inWindow": v.get("inWindow")} for k, v in (fresh.get("leagues") or {}).items()}))
          rel = meta.get("reliability") or {}
          print("reliability:", json.dumps(rel.get("counts")))
          for key, row in (fresh.get("leagues") or {}).items():
              if row.get("stale"):
                  print(f"::warning title=LineSmart stale odds ({key})::in-window pull is {row.get('ageMin')} min old (limit {fresh.get('staleAfterMin')} min), last pull {row.get('pulledAt')}")
          for f in glob.glob("site/data/*/index.json"):
              json.load(open(f))
          PY

      # Crawlable SEO pages (scripts/seo_pages.py): league hubs, game, player-props, team, UFC event and fighter pages,
      # and /<lg>/results/ archives, under site/<league>/**. Redirect stubs for retired URLs (incl. the old /preview/
      # pages), data/pages.json for the app's real-URL links, sitemap.xml (a sitemap index) and the homepage cards in
      # index.html. Reads site/data only (no network, no API key). Finished games stay up permanently (final score +
      # closing lines) in an archive on the data-history branch (_history/pages); without the worktree it builds from
      # site/data alone.
      - name: Build SEO pages
        id: seo
        continue-on-error: true
        env:
          ARCHIVE_DIR: ${{ steps.hist.outcome == 'success' && '_history/pages' || '' }}
        run: |
          python scripts/seo_pages.py
          if [ -d _history/pages ]; then rm -rf .linehist-snap/_pages && mkdir -p .linehist-snap && cp -r _history/pages .linehist-snap/_pages; fi

      # The sitemap this run deploys, for the indexnow job. Only when the SEO build ran with the archive, so each
      # page's lastmod is the stored content-change date (not "now") and the diff stays small.
      - name: Keep deployed sitemap for IndexNow
        if: steps.seo.outcome == 'success' && steps.hist.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p _indexnow/new
          cp site/sitemap.xml _indexnow/new/sitemap.xml
          shopt -s nullglob
          cp site/sitemap-*.xml _indexnow/new/

      - name: Upload IndexNow sitemaps
        if: steps.seo.outcome == 'success' && steps.hist.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: indexnow
          path: _indexnow/
          retention-days: 1
          if-no-files-found: ignore

      # Only persist history from a successful build. On a push race, fetch the new tip
      # and merge this run's snapshot onto it. Rosters, matchups, weather, advanced
      # stats, pages, and the health log are merged per record (a newer tip is never
      # replaced by the stale snapshot). Never force-push.
      - name: Save line history snapshot
        if: steps.build.outcome == 'success' && steps.hist.outcome == 'success'
        continue-on-error: true
        working-directory: _history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          msg="line history snapshot $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})"
          git add -A history odds rosters matchups weather advstats health $( [ -d pages ] && echo pages )
          if git diff --cached --quiet; then echo "No history changes."; exit 0; fi
          git commit -qm "$msg"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:refs/heads/data-history; then
              echo "Pushed: $(git log -1 --format='%h %s')"; ls -la history odds rosters matchups weather; exit 0
            fi
            echo "::warning::data-history push rejected (attempt $i); re-applying snapshot onto latest tip"
            sleep $((i * 5))
            git fetch --no-tags --depth=1 origin +data-history:refs/remotes/origin/data-history || continue
            git reset -q --hard origin/data-history
            python3 ../scripts/line_history.py apply --snap-dir ../.linehist-snap --history-dir history
            if [ -d ../.linehist-snap/_odds ]; then python3 ../scripts/line_history.py apply-odds --src ../.linehist-snap/_odds --dst odds; fi
            if [ -d ../.linehist-snap/_rosters ]; then python3 ../scripts/merge_pages_snapshot.py --src ../.linehist-snap/_rosters --dst rosters; fi
            if [ -d ../.linehist-snap/_matchups ]; then python3 ../scripts/merge_pages_snapshot.py --src ../.linehist-snap/_matchups --dst matchups; fi
            if [ -d ../.linehist-snap/_weather ]; then python3 ../scripts/merge_pages_snapshot.py --src ../.linehist-snap/_weather --dst weather; fi
            if [ -d ../.linehist-snap/_adv ]; then python3 ../scripts/merge_pages_snapshot.py --src ../.linehist-snap/_adv --dst advstats; fi
            if [ -d ../.linehist-snap/_pages ]; then python3 ../scripts/merge_pages_snapshot.py --src ../.linehist-snap/_pages --dst pages; fi
            if [ -f ../.linehist-snap/reliability.json ]; then python3 ../scripts/merge_pages_snapshot.py --health --src ../.linehist-snap/reliability.json --dst health; fi
            git add -A history odds rosters matchups weather advstats health $( [ -d pages ] && echo pages )
            if git diff --cached --quiet; then echo "Nothing left to push."; exit 0; fi
            git commit -qm "$msg"
          done
          echo "::error::Could not push line history after 5 attempts"; exit 1

      # configure-pages has to run in the same job as upload-pages-artifact. A scheduled refresh
      # does not upload that artifact (the publish run does, on a new commit).
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Stamp service-worker cache version and visible build
        # New VERSION on every deploy -> browsers install the new worker and drop the old shell cache.
        # Format: <shell content hash>-<UTC build time>. Data JSON is network-first, so the 30-min refresh is unaffected.
        # The visible footer / My Bets line is the short commit plus the build time in US Eastern.
        run: |
          H=$(cat site/*.html site/manifest.webmanifest site/assets/*.css site/assets/*.js | sha256sum | cut -c1-10)
          V="$H-$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"$V\";/" site/sw.js
          sed -i "s/^  const SITE_BUILD = \".*\";/  const SITE_BUILD = \"$V\";/" site/assets/pro-gate-core.js
          grep -q "const VERSION = \"$V\";" site/sw.js && grep -q "const SITE_BUILD = \"$V\";" site/assets/pro-gate-core.js && echo "sw.js VERSION=$V"
          python3 scripts/stamp_build.py --root site --sha "${GITHUB_SHA}"

      # Rankings snapshot for the private bucket. The file lives in _private/, outside the Pages artifact.
      # SUPABASE_SERVICE_ROLE is configured. The private upload returns HTTP 200.
      # It never prints the key. A failed upload does not block the site deploy.
      - name: Upload private Pro rankings snapshot
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python3 scripts/upload_pro_rankings.py --file _private/rankings.json

      # Pro screens are the private bundle, not a Pages file. Pack the committed pro/ sources
      # (the data build may have rewritten rankings-data.js; that snapshot is uploaded above).
      # This job already skips "Publish pages data" pushes, so a push here is a merge to main.
      # The same source is not uploaded twice. The secret is never printed. continue-on-error
      # keeps a failed upload from blocking the site deploy, and a non-zero exit marks the step.
      - name: Pack and upload the private Pro bundle
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          git checkout -- pro/rankings-data.js
          node scripts/pack_pro_bundle.mjs
          python3 scripts/upload_pro_bundle.py --file pro/dist/pro-app.js

      # A push to main is a new commit, and this run is the first Pages deployment of that SHA.
      - name: Upload deploy proof
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: deploy-proof
          path: site/data/meta.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Scheduled and manual refreshes all check out one commit (data is not committed), so deploying
      # from this run reuses that commit as pages_build_version. Pages then reports success and can keep
      # serving the previous artifact. The publish run below deploys this exact bundle under a new SHA.
      - name: Upload site bundle for the publish run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site-bundle
          path: site
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.data_ok == 'success' && github.event_name == 'push' && !startsWith(github.event.head_commit.message || '', 'Publish pages data ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pages deploy needs pages + id-token (OIDC). Checkout and the proof artifact need contents and actions.
    # No job-level concurrency here: a skipped deploy on a refresh must not hold pages-live, or it would
    # deadlock the publish run this workflow is waiting on. The workflow group already keeps a push deploy
    # from overlapping a refresh.
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download deploy proof
        uses: actions/download-artifact@v8
        with:
          name: deploy-proof
          path: _proof

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prove the live site is serving this build
        run: |
          set -euo pipefail
          meta=$(find _proof -name meta.json -type f -print -quit)
          test -n "$meta"
          python3 scripts/verify_live_deploy.py --meta "$meta" --timeout 240
          python3 scripts/reliability.py --meta "$meta" --fail-if-stale

  # Schedule and workflow_dispatch share the current main SHA, so this job creates one new commit
  # (a stamp, not the odds data) and dispatches a run on that commit to deploy the bundle.
  # GITHUB_TOKEN pushes do not start a push workflow. The dispatched run's event is workflow_dispatch,
  # which GITHUB_TOKEN is allowed to trigger, and its github.sha is the stamp commit.
  publish-request:
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.data_ok == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'push' && (inputs.publish_run_id || '') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      published: ${{ steps.dispatch.conclusion == 'success' && steps.dispatch.outputs.run_id != '' && 'true' || 'false' }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Point main at a new commit so Pages will publish this bundle
        id: stamp
        env:
          BUILD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          finish() { echo "skip=$1" >> "$GITHUB_OUTPUT"; echo "sha=${2:-}" >> "$GITHUB_OUTPUT"; }
          git fetch --no-tags --depth=1 origin main
          tip=$(git rev-parse origin/main)
          if [ "$tip" != "$BUILD_SHA" ]; then
            echo "::warning::main moved from $BUILD_SHA to $tip during the build. That push publishes itself. Not stacking a stamp."
            finish 1
            exit 0
          fi
          python3 scripts/verify_live_deploy.py --write-stamp .github/pages-deploy-stamp \
            --run-id "$RUN_ID" --attempt "${GITHUB_RUN_ATTEMPT}" --built-from "$BUILD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -- .github/pages-deploy-stamp
          names=$(git diff --cached --name-only)
          if [ "$names" != ".github/pages-deploy-stamp" ]; then
            echo "::error::refusing to commit anything except the Pages stamp"
            printf '%s\n' "$names"
            exit 1
          fi
          git commit -m "Publish pages data $(date -u +%Y-%m-%dT%H:%MZ) (run ${RUN_ID})"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/main"; then
              break
            fi
            echo "::warning::stamp push rejected (attempt $i); checking whether main moved"
            sleep $((i * 2))
            git fetch --no-tags --depth=1 origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$BUILD_SHA" ]; then
              echo "::warning::main moved to $tip during the push. Not overwriting it. The live site was left unchanged by this step."
              finish 1
              exit 0
            fi
            if [ "$i" = 5 ]; then
              echo "::error::Could not push the Pages stamp commit to main. The live site was left unchanged. If main is protected, allow github-actions[bot] to push this stamp (it is not the odds data)."
              exit 1
            fi
          done
          git fetch --no-tags --depth=1 origin main
          new=$(git rev-parse HEAD)
          if [ "$(git rev-parse origin/main)" != "$new" ]; then
            echo "::error::push reported success but origin/main is not the stamp commit"
            exit 1
          fi
          finish 0 "$new"
          echo "Stamp commit $new"

      - name: Dispatch the publish run on the new commit
        id: dispatch
        if: steps.stamp.conclusion == 'success' && steps.stamp.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.stamp.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$NEW_SHA" in
            *[!0-9a-f]*|'') echo "::error::stamp did not produce a commit sha"; exit 1 ;;
          esac
          case "$RUN_ID" in
            *[!0-9]*|'') echo "::error::run id is not numeric"; exit 1 ;;
          esac
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse origin/main)" != "$NEW_SHA" ]; then
            echo "::error::origin/main moved off the stamp commit before dispatch. The live site was left unchanged."
            exit 1
          fi
          gh workflow run refresh-and-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f "publish_run_id=$RUN_ID"
          found=""
          for _ in $(seq 1 30); do
            found=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-and-deploy.yml --commit "$NEW_SHA" --event workflow_dispatch --limit 5 --json databaseId,headSha --jq '[.[] | select(.headSha=="'"$NEW_SHA"'")][0].databaseId // empty')
            if [ -n "$found" ]; then
              echo "run_id=$found" >> "$GITHUB_OUTPUT"
              echo "Publish run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${found}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::No workflow_dispatch run appeared for $NEW_SHA"
          exit 1

      - name: Wait until the publish run has checked the live site
        if: steps.dispatch.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          case "$PUBLISH_RUN" in
            *[!0-9]*|'') echo "::error::publish run id missing"; exit 1 ;;
          esac
          gh run watch "$PUBLISH_RUN" --repo "$GITHUB_REPOSITORY" --exit-status

  # Deploy the bundle from publish_run_id. github.sha here is the stamp commit, so Pages gets a
  # deployment id it has not already marked successful. This job does not build and does not call
  # The Odds API. It fails unless the public meta.json matches the bundle's provider timestamps.
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_run_id || '') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the built site and drop the committed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          case "$PUBLISH_RUN_ID" in
            *[!0-9]*|'') echo "::error::publish_run_id must be the numeric Actions run id"; exit 1 ;;
          esac
          gh run download "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --name site-bundle --dir _bundle
          python3 scripts/verify_live_deploy.py --stage-bundle _bundle --dest site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prove the live site is serving this build
        run: |
          python3 scripts/verify_live_deploy.py --meta site/data/meta.json --timeout 240
          python3 scripts/reliability.py --meta site/data/meta.json --fail-if-stale

  # IndexNow (Bing, Yandex, Seznam...): after a successful deploy of main, POST the new / changed SEO page URLs
  # (sitemap diff against the pre-deploy live sitemap) once, in one batch. The key file is site/<key>.txt.
  # Never fails the run: the script always exits 0 and the job is continue-on-error. See docs/seo-pages.md.
  indexnow:
    needs: [build, deploy, publish-request]
    if: ${{ always() && github.ref == 'refs/heads/main' && (inputs.publish_run_id || '') == '' && needs.build.result == 'success' && (needs.deploy.result == 'success' || (needs.publish-request.result == 'success' && needs.publish-request.outputs.published == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout (ping script + key file only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/indexnow_ping.py
            /site/*.txt
          sparse-checkout-cone-mode: false

      - name: Download IndexNow sitemaps
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: indexnow
          path: _indexnow

      - name: Ping IndexNow
        run: python3 scripts/indexnow_ping.py --prev _indexnow/prev/sitemap.xml --new _indexnow/new/sitemap.xml
